// Web sučelje (dashboard, widgeti, editor, prijevodi) kopira se iz windows/web pri svakoj izgradnji;
// Android dodaje svoj most (android/web/android-bridge.js) i stranicu postavki.
plugins {
    id "com.android.application"
}

def keystoreProps = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

def webAssets = layout.buildDirectory.dir("generated/webassets")

android {
    namespace "hr.ivandic.solarnimonitor"
    compileSdk 36

    defaultConfig {
        applicationId "hr.ivandic.solarnimonitor"
        minSdk 26
        targetSdk 36
        versionCode 502
        versionName "5.0.2"
        // 4.0 AT-04: instrumentirani testovi na uređaju/emulatoru (gradlew connectedDebugAndroidTest)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // 5.0.2 (audit A-09): R8 smanjuje i zamućuje kod izdanja; most prema JavaScriptu čuva proguard-rules.pro
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // 5.0.1 (audit A-04, I-06): izdanje se nikad ne potpisuje javnim debug ključem – bez keystore.properties gradnja
            // izdanja pada (pakiranje traži storeFile), a debug gradnja radi kao i prije
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true  // BuildConfig.DEBUG: obični HTTP prema loopbacku samo u razvojnoj gradnji (audit A-11)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += webAssets
    }
}

dependencies {
    // samo za jedinične testove na računalu (JVM) – ne ulaze u APK
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    // samo za instrumentirane testove (androidTest) – ne ulaze u APK
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}

def copyWeb = tasks.register("copyWeb", Sync) {
    from(rootProject.file("../windows/web")) {
        exclude "settings.html", "settings.js", "settings.css", "bridge.js"
        into "web"
    }
    from(rootProject.file("../windows/web")) {
        include "settings.css"
        into "web"
    }
    from(rootProject.file("web")) { into "web" }
    into webAssets
}
tasks.named("preBuild") { dependsOn copyWeb }
